/* Sprocket Planner: Windows 98 look built on 98.css, scaled up for students.
   98.css draws the bevels; this file sets sizes, layout and the drawings.
   Text never goes below 13 px. */

:root {
  --font: Tahoma, Verdana, "Segoe UI", Arial, sans-serif;
  --pixel: "Pixelated MS Sans Serif", Tahoma, Arial, sans-serif;
  --desktop: #008080;

  --sel-bg: #000080; --sel-text: #ffffff;
  --title-a: #000080; --title-b: #1084d0;

  --hl: #e000c8; --hl-soft: rgba(224, 0, 200, 0.16);
  --good: #006400; --bad: #b00000; --same: #4a4a4a;
  --ok-bg: #dff3df; --warn-bg: #fff3b8; --stop-bg: #ffd9d9;
  --paper: #ffffff; --ink: #000000; --part: #b9bdca; --part-edge: #2a2a3a; --pin: #8d93ad; --index: #000080;
  --plastic: #c4e6f7; --plastic-edge: #1f6f9f; --pitch: #0047b3; --ghost: #7a1fc0;
  --grid: #e1ebf4; --grid-major: #b3cbe0; --follow: #c84000;
  --zone-red: #e03a3a; --zone-amber: #e8b800; --zone-green: #2a9d3a;
  --zone-red-bg: #ffe3e3; --zone-amber-bg: #fff5cc; --zone-green-bg: #e3f5e3;
  --changed: #000080; --focus: #000000;
}

  --zone-red-bg: #400000; --zone-amber-bg: #404000; --zone-green-bg: #003000;
  --changed: #00ffff; --focus: #ffff00;
}

html, body { margin: 0; padding: 0; }
body { background: var(--desktop); color: var(--text); font: 14px/1.4 var(--font); -webkit-text-size-adjust: 100%; }
*, *::before, *::after { box-sizing: border-box; }

/* ---- 98.css at student size ---- */
.title-bar, .window, button, input, label, legend, li[role=tab], option, select, table, textarea, ul.tree-view {
  font-family: var(--font); font-size: 14px; -webkit-font-smoothing: auto;
}
button { color: var(--text); text-shadow: none; min-height: 30px; min-width: 0; padding: 0 12px; background: var(--face);
  box-shadow: inset -1px -1px var(--dkshadow), inset 1px 1px var(--hilight), inset -2px -2px var(--shadow), inset 2px 2px var(--light); }
button:not(:disabled):active, button[aria-pressed="true"] {
  box-shadow: inset -1px -1px var(--hilight), inset 1px 1px var(--dkshadow), inset -2px -2px var(--light), inset 2px 2px var(--shadow); }
button[aria-pressed="true"] { background-image: linear-gradient(45deg, var(--light) 25%, transparent 25%, transparent 75%, var(--light) 75%), linear-gradient(45deg, var(--light) 25%, transparent 25%, transparent 75%, var(--light) 75%);
  background-size: 2px 2px; background-position: 0 0, 1px 1px; }
button:disabled { color: var(--shadow); text-shadow: 1px 1px 0 var(--hilight); }
button:focus-visible { outline: 1px dotted var(--focus); outline-offset: -4px; }
:focus-visible { outline: 2px solid var(--focus); outline-offset: 2px; }
input[type=text], select, textarea { font-size: 15px; height: auto; color: #000; }
body[data-scheme="contrast"] input[type=text], body[data-scheme="contrast"] select, body[data-scheme="contrast"] textarea { background: #000; color: #fff; box-shadow: inset 0 0 0 2px #fff; }
input[type=text]:focus, textarea:focus { outline: 2px solid var(--sel-bg); outline-offset: 0; }
select { height: 30px; padding: 2px 26px 2px 6px; background-position: right 0 top 50%; }
select:focus { background-color: var(--sel-bg); color: var(--sel-text); }
input[type=checkbox] + label, input[type=radio] + label { line-height: 18px; min-height: 18px; }
legend { background: var(--face); color: var(--text); padding: 0 4px; }
fieldset { margin: 0 0 10px; padding: 12px 10px 10px; min-width: 0; }
.window { background: var(--face); color: var(--text); }
.window-body { margin: 10px; }
.sr-only { position: absolute !important; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
u { border-bottom: 1px solid currentColor; text-decoration: none; }
a { color: #0000ee; }

/* ---- desktop and window ---- */
.desktop { min-height: 100vh; padding: 10px; }
.app-window { max-width: 1640px; margin: 0 auto; height: calc(100vh - 20px); display: flex; flex-direction: column; }
.title-bar { background: linear-gradient(90deg, var(--title-a), var(--title-b)); padding: 4px 4px 4px 6px; min-height: 30px; }
.title-bar-text { display: flex; align-items: center; gap: 6px; font-family: var(--font); font-size: 15px; font-weight: bold; color: #fff; letter-spacing: 0.2px; margin-right: 8px; }
.app-icon { display: inline-flex; width: 16px; height: 16px; }
.title-bar-controls button { min-width: 22px; min-height: 20px; width: 22px; height: 20px; padding: 0; background-position: center; background-repeat: no-repeat; margin-left: 2px; }
.title-bar-controls button.deco { pointer-events: none; }
.title-bar-controls #tb-help { margin-right: 4px; }
.title-bar-controls #tb-help[aria-pressed="true"] { box-shadow: inset -1px -1px var(--hilight), inset 1px 1px var(--dkshadow), inset -2px -2px var(--light), inset 2px 2px var(--shadow); }
body.whats-this, body.whats-this * { cursor: help !important; }

/* ---- menu bar ---- */
.menubar { display: flex; flex-wrap: wrap; gap: 0; padding: 2px 2px 1px; border-bottom: 1px solid var(--shadow); box-shadow: 0 1px 0 var(--hilight); position: relative; z-index: 30; }
.menu-top { position: relative; }
.menu-btn { background: transparent; box-shadow: none; min-height: 30px; padding: 2px 10px; font-size: 14px; }
.menu-btn:hover { box-shadow: inset -1px -1px var(--shadow), inset 1px 1px var(--hilight); }
.menu-btn[aria-expanded="true"] { background: var(--sel-bg); color: var(--sel-text); box-shadow: none; }
.menu-btn:focus-visible { outline: 1px dotted var(--focus); outline-offset: -3px; }
.menu-pop { position: absolute; left: 0; top: 100%; z-index: 60; min-width: 250px; padding: 2px; background: var(--face);
  box-shadow: inset -1px -1px var(--dkshadow), inset 1px 1px var(--light), inset -2px -2px var(--shadow), inset 2px 2px var(--hilight), 2px 2px 0 rgba(0,0,0,.25); }
.menu-item { display: flex; align-items: center; width: 100%; text-align: left; background: transparent; box-shadow: none; min-height: 30px; padding: 3px 14px 3px 4px; font-size: 14px; white-space: nowrap; }
.menu-item:hover, .menu-item:focus { background: var(--sel-bg); color: var(--sel-text); outline: none; box-shadow: none; }
.menu-item[aria-disabled="true"] { color: var(--shadow); text-shadow: 1px 1px 0 var(--hilight); }
.menu-item[aria-disabled="true"]:hover, .menu-item[aria-disabled="true"]:focus { color: var(--light); text-shadow: none; }
.mi-check { width: 22px; flex: none; text-align: center; }
.mi-label { flex: 1; }
.mi-accel { margin-left: 24px; }
.menu-sep { margin: 4px 2px; border-top: 1px solid var(--shadow); border-bottom: 1px solid var(--hilight); }
.menu-head { padding: 2px 8px 2px 26px; font-weight: bold; font-size: 13px; color: var(--text-dim); }

/* ---- toolbar and tooltips ---- */
.toolbar { display: flex; flex-wrap: wrap; align-items: center; gap: 2px; padding: 3px 4px; border-bottom: 1px solid var(--shadow); box-shadow: 0 1px 0 var(--hilight); }
.tb-btn { width: 42px; height: 42px; min-height: 42px; padding: 0; display: inline-flex; align-items: center; justify-content: center; background: var(--face); box-shadow: none; }
.tb-btn:hover:not(:disabled) { box-shadow: inset -1px -1px var(--shadow), inset 1px 1px var(--hilight); }
.tb-btn:active:not(:disabled), .tb-btn[aria-pressed="true"] { box-shadow: inset -1px -1px var(--hilight), inset 1px 1px var(--shadow); }
.tb-btn:disabled .px-icon { opacity: .35; filter: grayscale(1); }
.tb-sep { width: 2px; height: 34px; margin: 0 4px; border-left: 1px solid var(--shadow); border-right: 1px solid var(--hilight); }
.px-icon { image-rendering: pixelated; display: block; }
.tooltip { position: absolute; z-index: 100; background: var(--tip-bg); color: var(--text); border: 1px solid var(--text); padding: 2px 6px; font-size: 13px; white-space: nowrap; pointer-events: none; box-shadow: 1px 1px 0 rgba(0,0,0,.3); }

/* ---- the two panes ---- */
.client { flex: 1 1 auto; min-height: 0; display: grid; grid-template-columns: minmax(330px, 390px) minmax(0, 1fr); gap: 8px; padding: 8px 6px 6px; }
.pane { position: relative; min-height: 0; overflow-y: auto; overflow-x: hidden; padding: 4px 8px 8px 2px; }
.pane-views { padding-right: 6px; }
.row2 { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 0 10px; }
@media (max-width: 1180px) { .row2 { grid-template-columns: minmax(0, 1fr); } }

/* ---- inputs ---- */
.group > legend { font-weight: bold; }
.field { padding: 6px 4px 8px; margin: 0 -4px; }
.field + .field { border-top: 1px solid var(--light); }
.f-top { display: flex; align-items: center; gap: 6px; }
.f-top label, .f-top .lbl-like { font-weight: bold; flex: 1; display: block; }
.f-term { font-weight: normal; color: var(--text-dim); margin-left: 0.3em; }
.field.check .f-row label { display: inline-flex; }
.qmark { width: 24px; height: 24px; min-height: 24px; padding: 0; font-weight: bold; flex: none; }
.f-row { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; margin-top: 4px; }
.numbox { display: inline-flex; align-items: stretch; }
.numbox input[type=text] { width: 7.4em; height: 32px; padding: 3px 6px; line-height: 24px; }
.spin { display: inline-flex; flex-direction: column; }
.spin button { width: 20px; min-width: 20px; height: 16px; min-height: 16px; padding: 0; font-size: 8px; line-height: 16px; }
.f-unit { min-width: 1.2em; }
.f-hint { font-size: 13px; color: var(--text-dim); margin-top: 3px; }
.f-lock { font-size: 13px; color: var(--text-dim); font-style: italic; margin-top: 2px; }
.field.locked .numbox input { background: var(--face); color: var(--text-dim); }
.field.changed .numbox input { outline: 2px dashed var(--changed); outline-offset: 2px; }
.field.pointed { background: var(--hl-soft); box-shadow: inset 3px 0 0 var(--hl); }
input.partial { background: #fffbe6; }
input.bad { background: #ffe5e5; box-shadow: inset 0 0 0 2px var(--bad); }
.unit-switch { display: inline-flex; }
.unit-switch button { min-width: 38px; padding: 0 6px; }
.auto { display: inline-flex; align-items: center; margin-left: 4px; }
.shape-row button { padding: 0 10px; }
.shape-btn[aria-pressed="true"] { font-weight: bold; }
.shape-note { font-style: italic; color: var(--text-dim); }
.student-note { font-size: 13px; color: var(--text-dim); margin: 4px 2px 12px; }
.detail-student .lvl-expert { display: none !important; }
.detail-expert .student-note { display: none; }
.try { display: flex; flex-wrap: wrap; gap: 6px; }
.try button { padding: 0 8px; }

/* ---- badges ---- */
.bdg { font-weight: bold; font-size: 13px; white-space: nowrap; }
.bdg.up, .bdg.better { color: var(--good); }
.bdg.down, .bdg.worse { color: var(--bad); }
.bdg.same { color: var(--same); }
.bdg-slot:empty { display: none; }
/* inside a drawing, px means drawing units (mm): size badges from their label */
svg.drw text .bdg { font-size: 0.93em; }
svg.drw .bdg.up, svg.drw .bdg.better { fill: var(--good); }
svg.drw .bdg.down, svg.drw .bdg.worse { fill: var(--bad); }
svg.drw .bdg.same { fill: var(--same); }

/* ---- summary, chips, warnings ---- */
.summary { font-size: 17px; margin: 2px 0 6px; }
.facts { list-style: none; margin: 0 0 8px; padding: 0; display: flex; flex-wrap: wrap; gap: 4px 18px; }
.facts li { white-space: nowrap; }
.chips { list-style: none; padding: 0; margin: 0 0 6px; display: flex; flex-wrap: wrap; gap: 6px; }
.chip { display: inline-flex; align-items: center; gap: 6px; padding: 3px 8px; font-size: 13px; background: var(--window);
  box-shadow: inset -1px -1px var(--hilight), inset 1px 1px var(--shadow); }
.chip.ok { background: var(--ok-bg); } .chip.warn { background: var(--warn-bg); } .chip.stop { background: var(--stop-bg); font-weight: bold; }
.chip-ic, .w-ic { display: inline-flex; flex: none; }
.warnings { list-style: none; margin: 0; padding: 0; }
.warn-item { display: flex; gap: 8px; align-items: flex-start; padding: 5px 8px; margin-top: 4px; }
.warn-item.warn { background: var(--warn-bg); } .warn-item.stop { background: var(--stop-bg); }
.hl-row { background: var(--hl-soft) !important; box-shadow: inset 3px 0 0 var(--hl); }

/* ---- drawings ---- */
.drawbox { margin: 0; }
.drawing { position: relative; background: var(--paper); min-height: 60px; overflow: hidden;
  box-shadow: inset -1px -1px var(--hilight), inset 1px 1px var(--shadow), inset -2px -2px var(--light), inset 2px 2px var(--dkshadow); }
.drawing:focus { outline: none; }
figcaption { font-size: 13px; color: var(--text-dim); margin-top: 4px; }
svg.drw { display: block; margin: 0 auto; max-width: 100%; height: auto; font-family: var(--font); overflow: hidden; }
svg.drw * { vector-effect: non-scaling-stroke; }
svg.drw .lbl { fill: var(--ink); paint-order: stroke; stroke: var(--paper); stroke-width: 3px; stroke-linejoin: round; }
svg.drw .note, svg.drw .msg { fill: var(--text-dim); }
svg.drw .bad-t { fill: var(--bad); font-weight: bold; }
svg.drw .dl { stroke: var(--ink); stroke-width: 1px; fill: none; }
svg.drw .ext { stroke: var(--ink); stroke-width: 0.75px; fill: none; }
svg.drw .arw, svg.drw .dot { fill: var(--ink); stroke: none; }
svg.drw .drum { fill: var(--part); stroke: var(--part-edge); stroke-width: 1.2px; }
svg.drw .pin { fill: var(--pin); stroke: var(--part-edge); stroke-width: 1px; }
svg.drw .pin.index { fill: var(--index); }
svg.drw .sheet { fill: var(--plastic); stroke: var(--plastic-edge); stroke-width: 1px; }
svg.drw .hole { fill: transparent; stroke: none; }
svg.drw .pitch { fill: none; stroke: var(--pitch); stroke-width: 1.3px; stroke-dasharray: 10 3 2 3; }
svg.drw .pitchline { stroke: var(--pitch); stroke-width: 1px; stroke-dasharray: 8 3 2 3; }
svg.drw .bolt, svg.drw .hole-c { fill: var(--paper); stroke: var(--part-edge); stroke-width: 1px; }
svg.drw .pilot { fill: none; stroke: var(--part-edge); stroke-width: 1px; stroke-dasharray: 4 3; }
svg.drw .cmark, svg.drw .cline { stroke: var(--ink); stroke-width: 0.8px; stroke-dasharray: 6 2 1 2; fill: none; }
svg.drw .follow-line { stroke: var(--follow); stroke-width: 2px; }
svg.drw .follow-arw { fill: var(--follow); }
svg.drw .turnarc { stroke-width: 1.4px; }
svg.drw .frame { fill: none; stroke: var(--shadow); stroke-width: 1px; }
svg.drw .hit { fill: none; stroke: transparent; stroke-width: 14px; pointer-events: stroke; }
svg.drw .hit.hl { filter: none; stroke: transparent !important; }
svg.drw .grid { fill: none; stroke: var(--grid); stroke-width: 0.6px; }
svg.drw .grid.major { stroke: var(--grid-major); }
svg.drw .tipc { fill: none; stroke: var(--part-edge); stroke-width: 0.8px; stroke-dasharray: 3 2; }
svg.drw .sline { stroke: var(--part-edge); stroke-width: 0.8px; stroke-dasharray: 2 2; }
svg.drw .playl { stroke-width: 2px; stroke: var(--good); }
svg.drw .pin.closest { stroke-width: 1.6px; }
svg.drw .pin.near { fill: #f0a000; }
svg.drw .pin.hit { fill: #e00000; }
svg.drw .gapline .gap-l { stroke: var(--good); stroke-width: 2.5px; }
svg.drw .gapline .gap-dot { fill: var(--good); }
svg.drw .gapline.near .gap-l { stroke: #b06000; } svg.drw .gapline.near .gap-dot { fill: #b06000; }
svg.drw .gapline.near .gap-t { fill: #8a4a00; font-weight: bold; }
svg.drw .gapline.hit .gap-t { fill: var(--bad); font-weight: bold; }
/* hub face */
svg.drw .minr { fill: none; stroke: var(--good); stroke-width: 1px; stroke-dasharray: 7 4; }
svg.drw .minr.bad { stroke: var(--bad); stroke-width: 1.6px; }
svg.drw .pilot-f { fill: #a7acbb; stroke: var(--part-edge); stroke-width: 1px; }
svg.drw .pilot-e { fill: var(--part); stroke: var(--part-edge); }
svg.drw .head { fill: none; stroke: var(--part-edge); stroke-width: 0.8px; stroke-dasharray: 3 2; }
svg.drw .head.cb { stroke-dasharray: none; fill: rgba(0,0,0,.08); }
svg.drw .bsq { fill: none; stroke: var(--ink); stroke-width: 0.7px; stroke-dasharray: 2 3; }
svg.drw .gob-l { fill: none; stroke: #0060ff; stroke-width: 1.2px; stroke-dasharray: 6 3; }
svg.drw .cut { fill: var(--paper); stroke: var(--part-edge); stroke-width: 0.8px; }
/* track end view */
svg.drw .track { fill: #d9cfb4; stroke: var(--part-edge); stroke-width: 1px; }
svg.drw .shaft { fill: var(--paper); stroke: var(--ink); stroke-width: 1.2px; }
/* sheet pattern and guide */
svg.drw .sheet-o { fill: var(--plastic); stroke: #0000ff; stroke-width: 1.2px; }
svg.drw .hole-o { fill: var(--paper); stroke: #ff0000; stroke-width: 1px; }
svg.drw .guideline { stroke: var(--text-dim); stroke-width: 0.8px; stroke-dasharray: 2 4; }
svg.drw .guide { fill: #e8e0c8; stroke: var(--part-edge); stroke-width: 1px; }
svg.drw .fence { fill: #c8b890; stroke: var(--part-edge); stroke-width: 1px; }
/* chart */
svg.chart .zone.red { fill: var(--zone-red-bg); } svg.chart .zone.amber { fill: var(--zone-amber-bg); } svg.chart .zone.green { fill: var(--zone-green-bg); }
svg.chart .tick { stroke: rgba(0,0,0,.12); stroke-width: 1px; }
body[data-scheme="contrast"] svg.chart .tick { stroke: rgba(255,255,255,.25); }
svg.chart .zero { stroke: var(--bad); stroke-width: 1.5px; }
svg.chart .trace { fill: none; stroke-linejoin: round; }
svg.chart .trace.main { stroke: var(--ink); stroke-width: 2.2px; }
svg.chart .trace.lo { stroke: #a05a00; stroke-width: 1.4px; stroke-dasharray: 6 3; }
svg.chart .trace.hi { stroke: #00707a; stroke-width: 1.4px; stroke-dasharray: 2 3; }
svg.chart .tmark { fill: var(--bad); stroke: var(--paper); stroke-width: 1.5px; }
svg.chart .nowl { stroke: var(--follow); stroke-width: 1.5px; stroke-dasharray: 4 3; }
svg.chart .nowd { fill: var(--follow); }
svg.chart .axis, svg.chart .axis-t { fill: var(--ink); }
svg.chart .zone-t { fill: var(--bad); }
/* ghosts */
svg.drw .ghost .gl { fill: none; stroke: var(--ghost); stroke-width: 1.5px; stroke-dasharray: 5 3; }
svg.drw .ghost .glbl { fill: var(--ghost); font-weight: bold; }
svg.drw .ghost.g-b .gl { stroke: #c05000; } svg.drw .ghost.g-b .glbl { fill: #c05000; }
svg.drw .ghost.g-c .gl { stroke: #007a50; } svg.drw .ghost.g-c .glbl { fill: #007a50; }
svg.drw .ghost.g-d .gl { stroke: #a00050; } svg.drw .ghost.g-d .glbl { fill: #a00050; }
svg.drw .ghost.g-last .gl { stroke: var(--ghost); }
body[data-ghost="faint"] svg.drw .ghost { opacity: 0.4; }
body[data-ghost="medium"] svg.drw .ghost { opacity: 0.7; }
body[data-ghost="strong"] svg.drw .ghost { opacity: 1; }
body[data-ghost="strong"] svg.drw .ghost .gl { stroke-width: 2.2px; }

/* ---- highlight: selecting a box points to it in the pictures ---- */
svg.drw.focus-mode .d { opacity: 0.3; transition: opacity 0.12s; }
svg.drw.focus-mode .d.hl { opacity: 1; }
svg.drw .hl { filter: drop-shadow(0 0 1.5px var(--hl)) drop-shadow(0 0 3px var(--hl)); }
svg.drw .hl.part, svg.drw .hl .dl, svg.drw .hl .ext, svg.drw .hl line, svg.drw .hl polyline, svg.drw .hl.trace { stroke: var(--hl) !important; }
svg.drw .hl .arw, svg.drw .hl .dot, svg.drw .hl .gap-dot { fill: var(--hl) !important; }
svg.drw .hl .lbl, svg.drw .lbl.hl { fill: var(--hl) !important; font-weight: bold; }
svg.drw .hl.hole, svg.drw .hl.hole-o { fill: var(--hl-soft) !important; stroke: var(--hl) !important; stroke-width: 1.5px; }
svg.drw .hl.sheet, svg.drw .hl.drum, svg.drw .hl.pin { stroke-width: 2px; }
body[data-labels="key"] svg.drw .lvl-all:not(.hl) { display: none; }
body[data-labels="none"] svg.drw .dim:not(.hl) { display: none; }
.callout { position: absolute; z-index: 5; background: var(--tip-bg); color: var(--text); border: 1px solid var(--text); padding: 4px 8px;
  font-size: 14px; line-height: 1.3; box-shadow: 2px 2px 0 rgba(0,0,0,.3); pointer-events: none; max-width: 320px; }
.callout::after { content: ""; position: absolute; left: var(--tail, 20px); bottom: -8px; transform: translateX(-50%);
  border-left: 7px solid transparent; border-right: 7px solid transparent; border-top: 8px solid var(--text); }
.callout.below::after { bottom: auto; top: -8px; border-top: 0; border-bottom: 8px solid var(--text); }

/* ---- play bar ---- */
.playbar { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; margin-top: 8px; }
.playbar input[type=range] { flex: 1 1 200px; min-width: 160px; }
.play-btn { min-width: 96px; font-weight: bold; }
.readout { font-size: 14px; min-width: 16em; }

/* ---- tables ---- */
.tablewrap { overflow-x: auto; max-width: 100%; }
.sunken-panel { background: var(--window); }
table.measure, table.cmp, table.saved { width: 100%; border-collapse: collapse; white-space: normal; background: var(--window); color: var(--text); }
table.measure th, table.measure td, table.cmp th, table.cmp td, table.saved th, table.saved td { padding: 4px 8px; text-align: left; font-size: 14px; height: auto; vertical-align: middle; }
table.measure thead th, table.cmp thead th, table.saved thead th { background: var(--face); position: sticky; top: 0; z-index: 1; font-weight: normal;
  box-shadow: inset -1px -1px var(--dkshadow), inset 1px 1px var(--hilight), inset -2px -2px var(--shadow), inset 2px 2px var(--light); }
table.measure tbody th { font-weight: normal; }
table.measure tr.sec th { background: var(--light); font-weight: bold; color: var(--text); }
body[data-scheme="contrast"] table.measure tr.sec th { background: #202020; }
table.measure td.num, table.cmp td.num { white-space: nowrap; font-variant-numeric: tabular-nums; }
table.measure td.bdg-cell { white-space: nowrap; }
table.measure tr.pick { cursor: pointer; }
table.measure tr.pick:hover th { text-decoration: underline; }
.term { color: var(--text-dim); font-size: 13px; }
table.cmp th.now, table.cmp td.now { font-weight: bold; }
table.cmp .cmp-on { background: rgba(0, 0, 128, 0.07); }

/* ---- big picture: dial, ruler, how it works ---- */
.bigpic { display: grid; grid-template-columns: minmax(170px, 230px) auto minmax(0, 1fr); align-items: center; gap: 8px; }
.bigpic .drawing { min-height: 0; }
.turnslide { display: flex; flex-direction: column; align-items: center; font-weight: bold; color: var(--text); }
.ts-arrow { font-size: 30px; line-height: 1; }
.ts-word { font-size: 13px; white-space: nowrap; }
@media (max-width: 620px) {
  .bigpic { grid-template-columns: minmax(0, 1fr); }
  .bigpic .dialbox { max-width: 260px; margin: 0 auto; width: 100%; }
  .turnslide { flex-direction: row; gap: 6px; justify-content: center; }
  .ts-arrow { transform: rotate(90deg); font-size: 24px; }
}

<script>
/* Sprocket Planner, built 2026-11-21. Source: core/, state/, draw/, ui/. */
(function () {
"use strict";
var defs = {};
defs["core/analyze.js"] = { map: {"./geometry.js":"core/geometry.js","./taper.js":"core/taper.js","./sheetfiles.js":"core/sheetfiles.js"}, fn: function (module, exports, require) {
"use strict";
// One full analysis of a design: geometry, the clearance sweep, the two
// sheet-height sweeps, every limit check, and a flat map of numbers (v) that
// the tables, badges, meters and drawings all read. Nothing else computes
// geometry.
const G = require("./geometry.js");
const T = require("./taper.js");
const S = require("./sheetfiles.js");

const SAMPLES = 240;
const SERVO_STD = 300, SERVO_5TURN = 1800;
const HEIGHT_STEP = 0.2;

function sweep(p, n) {
  const d = G.derive(p);
  // When holes run together (hole spacing <= hole size) there is no plastic
  // between them, so there is nothing to measure: those samples become NaN.
  const tr = G.trace(p, d, n).map(([th, g]) => [th, g < 1e8 ? g : NaN]);
  let k = -1;
  for (let i = 0; i < tr.length; i++) if (isFinite(tr[i][1]) && (k < 0 || tr[i][1] < tr[k][1])) k = i;
  return { d, trace: tr, tight: k < 0 ? NaN : tr[k][1], tightAt: k < 0 ? NaN : tr[k][0], play: d.play };
}

// Zones for the four fit meters. Each returns "red", "amber" or "green".
const ZONES = {
  play: v => (v < 0.05 || v > 0.6) ? "red" : (v < 0.15 || v > 0.35) ? "amber" : "green",
  tight: v => !isFinite(v) || v < 0 ? "red" : v <= 0.08 ? "amber" : "green",
  web: v => v < 1.5 ? "red" : v <= 2.5 ? "amber" : "green",
  inSheet: v => v < 1 ? "red" : v < 1.5 ? "amber" : "green"
};

function f(v, dp) { return (Math.round(v * 10 ** dp) / 10 ** dp).toFixed(dp).replace("-", "−"); }

function inputValues(p) {
  const v = {};
  for (const k of Object.keys(p)) if (typeof p[k] === "number") v[k] = p[k];
  v.travelIn = p.travel / 25.4;
  return v;
}

function analyze(p) {
  const errors = G.validate(p);
  const v = inputValues(p);
  if (errors.length) {
    return {
      ok: false, p, v, errors,
      checks: errors.map((t, i) => ({ id: "input" + i, level: "stop", title: "Fix this number", text: t })),
      chips: [], counts: { stop: errors.length, warn: 0 }
    };

  const main = sweep(p, SAMPLES);
  const d = main.d;
  const loGap = Math.max(0, p.gap - HEIGHT_STEP), hiGap = p.gap + HEIGHT_STEP;
  const lo = sweep({ ...p, gap: loGap }, SAMPLES);
  const hi = sweep({ ...p, gap: hiGap }, SAMPLES);

  const geoTaper = T.taperFromTip(p.pinW, p.pinStraight, p.pinH, p.tipD);

  Object.assign(v, {
    tpr: d.tpr, perDeg: d.perDeg, P: d.P, Rp: d.Rp, pitchD: d.pitchD, drumD: d.drumD, r0: d.r0,
    overD: d.overD, tipR: d.tipR, yb: d.yb, web: d.web, wUnder: d.wUnder, play: d.play,
    tight: main.tight, tightAt: main.tightAt, inSheet: d.inSheet, win: d.win, holes: d.holes,
    run: d.run, guideLen: d.guideLen, nGuide: d.nGuide, step: d.step,
    hubMinD: d.hubMinD, hubRoom: d.r0 - d.hubMinR, boltR: d.boltR,
    screwL: d.screwL === undefined ? NaN : d.screwL, pinGapOnDrum: d.pinGapOnDrum,
    loGap, loPlay: lo.play, loTight: lo.tight, hiGap, hiPlay: hi.play, hiTight: hi.tight,
    sheetLen: sheet.L, rowOffset: sheet.rowY, sheetHoles: sheet.n,
    slotH: p.sheetT + p.trackClearT, slotW: p.sheetW + p.trackClearW,
    rowFromWall: sheet.rowY + p.trackClearW / 2,
    turns: p.rotation / 360, slab: p.pinFlat * p.pinW,
    taperGeo: geoTaper.ok ? geoTaper.deg : NaN,
    guideBoxL: (d.nGuide - 1) * d.P + 12, guideBoxW: p.edgeOffset + p.holeD / 2 + 6 + 4,
    guideBoxH: p.guideT + p.sheetT * 0.8

  // ---------- checks: each one plain words plus how to fix it ----------
  const checks = [];
  const add = (id, level, title, text) => checks.push({ id, level, title, text });

  if (!(d.play > 0)) add("holes", "stop", "Pins wider than the holes",
    "Pins are " + f(d.wUnder, 2) + " mm wide where they enter " + f(p.holeD, 2) + " mm holes. Use thinner pins or bigger holes.");
  if (main.tight < 0) add("fit", "stop", "Pins hit the hole edges",
    "Pins hit the hole edges while turning. Use thinner pins, a steeper taper, or bigger holes.");
  else if (main.tight <= 0.08) add("fit", "warn", "Tight while turning",
    "Pins clear the holes by only " + f(main.tight, 3) + " mm. Thinner pins or bigger holes give more room.");
  if (!(d.web > 0)) add("web", "stop", "Holes run together",
    "Holes overlap, so no plastic is left between them. Use fewer pins or a bigger turn-to-slide ratio.");
  else if (d.web < 1.5) add("web", "stop", "Holes too close",
    "Holes too close: use fewer pins or a bigger turn-to-slide ratio.");
  else if (d.web <= 2.5) add("web", "warn", "Thin plastic between holes",
    "Only " + f(d.web, 2) + " mm of plastic between holes. It may crack. Use fewer pins.");
  if (d.r0 < d.hubMinR) add("hub", "stop", "Wheel too small for the hub screws",
    "The wheel must be at least " + f(d.hubMinD, 2) + " mm across for the screws. Slide farther per turn, or turn less.");
  if (d.inSheet < 1) add("inSheet", "stop", "No pin holds the sheet at times",
    "At times no pin is in the sheet. Use more pins or taller pins.");
  else if (d.inSheet < 1.5) add("inSheet", "warn", "Few pins in the sheet",
    "Sometimes only one pin pushes the sheet. More pins share the push.");
  if (p.rotation > SERVO_5TURN) add("servo", "stop", "Past the 5-turn servo",
    "A 5-turn servo stops at 1800°. Continuous mode turns farther but loses position control.");
  else if (p.rotation > SERVO_STD) add("servo", "warn", "Needs a 5-turn servo",
    "A standard servo turns only 300°. Use a 5-turn servo for this design.");
  const loBad = lo.tight < 0 || !(lo.play > 0), hiBad = hi.tight < 0 || !(hi.play > 0);
  if (loBad || hiBad) add("height", "warn", "Fussy about sheet height",
    "If the sheet sits " + (loBad ? f(p.gap - loGap, 1) + " mm lower" : HEIGHT_STEP + " mm higher") +
    ", pins rub. Build the track carefully, or use straight pins.");

  if (!(p.pinH > p.gap + p.sheetT)) add("reach", "stop", "Pins too short",
    "Pins don't reach through the sheet. Make them taller than " + f(p.gap + p.sheetT, 2) + " mm.");

    "The straight part is taller than the pin. Shorten it or make the pin taller.");
  else if (!(p.tipD > 0)) add("tip", "stop", "Pin comes to a point",
    "Pin comes to a point; lower the angle or the height.");
  else if (!geoTaper.ok || (heldTip && heldTip.reason === "tooBig")) {
    const minDeg = T.minTaper(p.pinW, p.pinStraight, p.pinH);

// comment, check and console message in the file stays as it is, so OpenSCAD
// still explains problems in plain words. "Settings only" is the parameter
// block, to paste over the top of a file already open in OpenSCAD.

function scadValues(design, part) {
  const out = { part: JSON.stringify(part === "drill_guide" ? "drill_guide" : "sprocket") };

// Taper angle <-> tip diameter for the pin profile.
//
// The pin is the convex hull of its base rectangle (+-w/2, up to the straight
// section s) and a tip semicircle of radius b = d/2 centred at H - b.
// The taper angle is the angle of the pin's sides from straight up, above the
// straight section. Holding w, s and H:
//
//     b = (a cos(alpha) - (H - s) sin(alpha)) / (1 - sin(alpha)),   a = w/2, d = 2b
//
// For tip -> angle we use the tangent point on the tip circle (the same
// construction as OpenSCAD's pin_w_at), then alpha = atan((a - Tx) / (Ty - s)).
//
// A shape is valid when 0 < b <= a (the tip is no wider than the pin) and the
// tangent point sits above the straight section. That works out to
// alpha >= minTaper(w, s, H) and alpha < maxTaper(w, s, H).

// tip wider than the pin.

  return a > k ? 2 * Math.atan2(a - k, a) / D2R : 0;

function maxTaper(w, s, H) {

  if (!(k > 0) || !(a > 0)) return NaN;
  return Math.atan2(a, k) / D2R;

// reason: "range" (angle outside 0..90), "height" (straight part not below the
// top), "pointed" (b <= 0: the sides meet below the top), "tooBig" (the tip
// circle would be wider than the pin, or too big for this angle).

defs["ui/highlight.js"] = { map: {"./dom.js":"ui/dom.js","../state/fields.js":"state/fields.js"}, fn: function (module, exports, require) {
"use strict";
// "Selecting a box points to it in the pictures."
// Focusing an input lights up its dimension in every drawing (highlight color,
// soft glow), fades everything else to about 30%, and shows a callout bubble
// in plain words. It works the other way too: hovering or tapping a dimension
// lights up its input box and scrolls it into view.
const { h, $$ } = require("./dom.js");
const { FIELD, METRICS } = require("../state/fields.js");

function createHighlighter({ root, inputsPane, getSettings, isVisibleField }) {
  let focusKey = null, hoverKey = null;
  const bubbles = new Map();

  const keyNow = () => hoverKey || focusKey;
  const textFor = key => (FIELD[key] && FIELD[key].callout) || (METRICS[key] && METRICS[key].name + (METRICS[key].term ? " (" + METRICS[key].term + ")" : "")) || key;

  function clearBubbles() { for (const b of bubbles.values()) b.remove(); bubbles.clear(); }

  function apply() {
    const key = keyNow();
    clearBubbles();
    for (const svg of $$("svg.drw", root)) {
      for (const el of svg.querySelectorAll(".hl")) el.classList.remove("hl");
      if (!key) { svg.classList.remove("focus-mode"); continue; }
      const hits = svg.querySelectorAll('[data-key~="' + key + '"]');
      svg.classList.toggle("focus-mode", hits.length > 0);
      for (const el of hits) el.classList.add("hl");
      if (hits.length) bubble(svg, hits, key);
    }
    for (const el of $$(".hl-row", root)) el.classList.remove("hl-row");
    if (key) for (const el of $$('[data-hl~="' + key + '"]', root)) el.classList.add("hl-row");
    for (const el of $$(".field.pointed", inputsPane)) el.classList.remove("pointed");
    if (hoverKey) { const f = inputsPane.querySelector('.field[data-field="' + hoverKey + '"]'); if (f) f.classList.add("pointed"); }
  }

  // One bubble per drawing, beside the first lit part, kept inside the box.
  function bubble(svg, hits, key) {
    const box = svg.closest(".drawing");
    if (!box) return;
    let target = null;
    for (const el of hits) { const r = el.getBoundingClientRect(); if (r.width + r.height > 2) { target = r; if (el.matches(".dim")) break; } }
    if (!target) return;
    const br = box.getBoundingClientRect();
    const b = h("div.callout", { role: "note" }, textFor(key));
    box.appendChild(b);
    const bw = Math.min(b.offsetWidth, br.width - 8), bh = b.offsetHeight;
    let x = target.left - br.left + target.width / 2 - bw / 2;
    let y = target.top - br.top - bh - 10;
    let below = false;
    if (y < 2) { y = target.bottom - br.top + 10; below = true; }
    if (y + bh > br.height - 2) { y = Math.max(2, br.height - bh - 2); }
    x = Math.max(4, Math.min(br.width - bw - 4, x));
    b.style.left = x + "px"; b.style.top = y + "px"; b.style.maxWidth = (br.width - 8) + "px";
    const tail = Math.max(10, Math.min(bw - 14, target.left - br.left + target.width / 2 - x));
    b.style.setProperty("--tail", tail + "px");
    b.classList.toggle("below", below);
    bubbles.set(box, b);
  }

  // First key on an element that has a visible input box.
  function inputKeyOf(el) {
    const keys = (el.getAttribute("data-key") || "").split(/\s+/).filter(Boolean);
    return keys.find(k => FIELD[k] && isVisibleField(k)) || keys[0] || null;
  }

  function pointFromDrawing(el, scroll) {
    const key = inputKeyOf(el);
    if (!key) return;
    hoverKey = key;
    apply();
    const f = inputsPane.querySelector('.field[data-field="' + key + '"]');
    if (f && scroll) scrollIntoViewIfNeeded(f);
  }

  function scrollIntoViewIfNeeded(el) {
    const pane = el.closest(".pane");
    if (pane && getComputedStyle(pane).overflowY === "auto") {
      const pr = pane.getBoundingClientRect(), r = el.getBoundingClientRect();
      if (r.top < pr.top || r.bottom > pr.bottom) el.scrollIntoView({ block: "nearest", behavior: "smooth" });
    } else {
      const r = el.getBoundingClientRect();
      if (r.top < 0 || r.bottom > window.innerHeight) el.scrollIntoView({ block: "center", behavior: "smooth" });
    }
  }

  // hover over drawings
  root.addEventListener("pointerover", e => {
    if (e.pointerType === "touch" || !getSettings().hover) return;
    const el = e.target.closest && e.target.closest("svg.drw [data-key]");
    if (!el) return;
    pointFromDrawing(el, true);
  });
  root.addEventListener("pointerout", e => {
    if (!hoverKey) return;
    const to = e.relatedTarget && e.relatedTarget.closest && e.relatedTarget.closest("svg.drw [data-key]");
    if (to) return;
    hoverKey = null; apply();
  });
  // tap on a drawing part: light up its box and scroll to it
  root.addEventListener("click", e => {
    if (e.target.closest("[data-dim-label]") && e.target.closest(".editing-on")) return;
    const el = e.target.closest && e.target.closest("svg.drw [data-key]");
    if (!el || e.defaultPrevented) return;
    pointFromDrawing(el, true);
    if (e.pointerType === "touch" || (e.detail && e.detail > 0)) setTimeout(() => { if (hoverKey) { hoverKey = null; apply(); } }, 2500);
  });
  // hover over an input row points at its dimension (Highlight on hover)
  inputsPane.addEventListener("pointerover", e => {
    if (e.pointerType === "touch" || !getSettings().hover) return;
    const f = e.target.closest(".field[data-field]");
    if (!f || focusKey) return;
    const k = f.getAttribute("data-field");
    if (k !== hoverKey) { hoverKey = k; apply(); }
  });
  inputsPane.addEventListener("pointerleave", () => { if (hoverKey) { hoverKey = null; apply(); } });

  return {
    setFocus(key) { focusKey = key; hoverKey = null; apply(); },
    clearFocus(key) { if (!key || focusKey === key) { focusKey = null; apply(); } },
    get key() { return keyNow(); },
    apply,
    // re-apply on freshly drawn parts (animation regenerates some groups)
    refresh(el) {
      const key = keyNow();
      if (!key || !el) return;
      for (const x of el.querySelectorAll('[data-key~="' + key + '"]')) x.classList.add("hl");
    }
  };
}

module.exports = { createHighlighter };

} };

function svgIcon(name, size = 32, title) {
  const rows = ICONS[name];
  if (!rows) return "";
  let rects = "";
  for (let y = 0; y < 16; y++) {
    const row = rows[y] || "";
    let x = 0;
    while (x < 16) {
      const ch = row[x] || ".";
      let w = 1;
      while (x + w < 16 && (row[x + w] || ".") === ch) w++;
      if (ch !== "." && PAL[ch]) rects += '<rect x="' + x + '" y="' + y + '" width="' + w + '" height="1" fill="' + PAL[ch] + '"/>';
      x += w;
    }
  }

    (title ? "<title>" + title + "</title>" : "") + rects + "</svg>";
}

  return "data:image/svg+xml;charset=utf-8," + encodeURIComponent(svgIcon(name, 16).replace(' class="px-icon"', ""));
